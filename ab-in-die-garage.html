<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Ab in die Garage! – Autos sortieren</title>
<style>
  :root{
    --blue:#2f6fd0; --blue-dark:#1f4f9c;
    --yellow:#f2ac1d; --yellow-dark:#cf8c00;
    --green:#2f9e44; --green-dark:#1f7a31;
    --red:#e23b3b; --red-dark:#a82020;
    --ink:#2b2d42; --lot:#f4f6fb; --line:#2b2d42;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%,#cfe6ff 0%,#aacdf5 38%,#7fb0ec 100%);
    color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  .sky-deco{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .cloud{ position:absolute; background:rgba(255,255,255,.85); border-radius:50px;
    box-shadow:0 18px 40px rgba(31,79,156,.12); animation:drift linear infinite; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before{ width:55%; height:130%; top:-40%; left:12%; }
  .cloud::after{ width:40%; height:120%; top:-30%; right:14%; }
  @keyframes drift{ from{transform:translateX(-25vw)} to{transform:translateX(125vw)} }

  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center;
    padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom)); }

  header{ width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 2px 4px; }
  h1{ margin:0; font-size:clamp(17px,4.2vw,28px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 var(--blue-dark),0 4px 14px rgba(0,0,0,.18); }
  .controls{ display:flex; gap:8px; align-items:center; }
  .moves{ background:rgba(255,255,255,.9); color:var(--ink); font-weight:800; border-radius:999px;
    padding:8px 12px; font-size:clamp(12px,2.6vw,15px); }
  .btn{ border:none; cursor:pointer; font-family:inherit; font-weight:800; color:#fff; background:var(--blue-dark);
    border-radius:999px; padding:10px 15px; font-size:clamp(13px,2.6vw,16px); box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .08s; }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .btn.icon{ padding:10px 12px; background:#fff; color:var(--blue-dark); }

  .toolbar{ width:100%; max-width:560px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 2px 6px; }
  .seg{ display:flex; background:rgba(255,255,255,.92); border-radius:999px; padding:3px; box-shadow:0 3px 0 rgba(0,0,0,.12); flex:1; }
  .seg button{ flex:1; border:none; background:transparent; font-family:inherit; font-weight:800; cursor:pointer;
    color:var(--blue-dark); border-radius:999px; padding:8px 3px; font-size:clamp(10px,2.4vw,14px); transition:.12s; white-space:nowrap; }
  .seg button.on{ background:var(--blue-dark); color:#fff; }

  .stage{ width:100%; display:flex; flex-direction:column; gap:8px; }
  .garages{ display:grid; gap:8px; }
  .garage{ position:relative; aspect-ratio:5/4; background:#fff; border-radius:12px;
    box-shadow:0 6px 16px rgba(31,79,156,.18); overflow:hidden; border:3px solid #fff; }
  .garage svg{ width:100%; height:100%; display:block; }
  .garage.done{ animation:pop .45s ease; }
  @keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.06)} 100%{transform:scale(1)} }
  .check{ position:absolute; top:5px; right:6px; font-size:clamp(14px,3.6vw,20px); opacity:0; transform:scale(.4); transition:.25s; }
  .garage.done .check{ opacity:1; transform:scale(1); }

  .board{ position:relative; width:100%; background:var(--lot);
    border:4px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:inset 0 2px 8px rgba(43,45,66,.08); }
  .cells{ position:absolute; inset:0; display:grid; }

  .tiles{ position:absolute; inset:0; }
  .tile{ position:absolute; padding:clamp(2px,1vw,9px); left:0; top:0;
    transition:left .16s cubic-bezier(.2,.8,.3,1), top .16s cubic-bezier(.2,.8,.3,1);
    cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tile svg{ width:100%; height:100%; pointer-events:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .tile.movable svg{ filter:drop-shadow(0 5px 8px rgba(0,0,0,.25)); }
  .tile:active{ transform:scale(.95); }
  .tile.bump svg{ animation:bump .3s ease; }
  @keyframes bump{ 0%,100%{transform:none} 50%{transform:translateY(-4px) scale(1.04)} }
  .num{ position:absolute; top:10%; left:8%; background:#fff; color:var(--ink); font-weight:800;
    width:30%; max-width:34px; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:clamp(11px,3vw,18px); border:2px solid var(--ink); box-shadow:0 2px 4px rgba(0,0,0,.25); pointer-events:none; }

  .win{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(20,40,80,.45); backdrop-filter:blur(3px); }
  .win.show{ display:flex; animation:fade .3s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .win-card{ background:#fff; border-radius:24px; padding:26px 28px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3); max-width:86vw; animation:rise .4s cubic-bezier(.2,1.3,.4,1); }
  @keyframes rise{ from{transform:translateY(30px) scale(.9); opacity:0} to{transform:none; opacity:1} }
  .win-card h2{ margin:6px 0 4px; font-size:clamp(26px,6vw,40px); color:var(--green); }
  .win-card p{ margin:0 0 18px; font-size:clamp(15px,3.4vw,19px); }
  .stars{ font-size:clamp(34px,8vw,54px); margin-bottom:6px; }
  canvas#confetti{ position:fixed; inset:0; z-index:60; pointer-events:none; }

  .hint{ width:100%; max-width:560px; text-align:center; color:#fff; font-weight:700;
    font-size:clamp(12px,3vw,15px); opacity:.95; margin-top:2px; text-shadow:0 1px 2px rgba(0,0,0,.2); }
</style>
</head>
<body>
<div class="sky-deco" id="clouds"></div>

<div class="app">
  <header>
    <h1>🚗 Ab in die Garage!</h1>
    <div class="controls">
      <div class="moves" id="moves">Züge: 0</div>
      <button class="btn icon" id="sound" aria-label="Ton an oder aus">🔊</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="diff">
      <button data-cols="3" data-rows="2">Leicht</button>
      <button data-cols="3" data-rows="3" class="on">Mittel</button>
      <button data-cols="4" data-rows="4">Schwer</button>
      <button data-cols="4" data-rows="4" data-mode="ordinal">Experte</button>
      <button data-cols="4" data-rows="3" data-mode="sort">Mathe ±</button>
    </div>
    <button class="btn icon" id="shuffle" aria-label="Neu mischen">🔀</button>
  </div>

  <div class="stage" id="stage">
    <div class="garages" id="garages"></div>
    <div class="board" id="board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="hint" id="hint">Schiebe jede Farbe in ihre Spalte unter der passenden Garage.</div>
</div>

<div class="win" id="win">
  <div class="win-card">
    <div class="stars">⭐⭐⭐</div>
    <h2>Geschafft!</h2>
    <p id="wintext">Alle Autos stehen richtig.</p>
    <button class="btn" id="again">Nochmal spielen</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
const COLORS={
  blue:{fill:"#2f6fd0",dark:"#1f4f9c"}, yellow:{fill:"#f2ac1d",dark:"#cf8c00"},
  green:{fill:"#2f9e44",dark:"#1f7a31"}, red:{fill:"#e23b3b",dark:"#a82020"}
};
const ALLCOLORS=["blue","yellow","green","red"];

let COLS=3, ROWS=3, mode="color";   // "color" | "ordinal" | "sort"
function colors(){ return ALLCOLORS.slice(0,COLS); }
function colColor(i){ return colors()[i%COLS]; }
function matches(t,i){ return (mode==="color") ? t.color===colColor(i) : t.goal===i; }
function randInts(n,min,max){ const s=new Set(); while(s.size<n) s.add(min+Math.floor(Math.random()*(max-min+1))); return [...s]; }
function buildSolved(){
  const total=COLS*ROWS, arr=new Array(total).fill(null), cs=colors();
  for(let col=0; col<COLS; col++){
    const cells=[]; for(let r=0;r<ROWS;r++){ const idx=r*COLS+col; if(idx!==total-1) cells.push(idx); }
    if(mode==="sort"){
      const nums=randInts(cells.length,-100,100).sort((a,b)=>a-b);
      cells.forEach((idx,k)=> arr[idx]={color:cs[col], number:nums[k]});
    } else {
      cells.forEach(idx=>{ const r=Math.floor(idx/COLS); arr[idx]={color:cs[col], number:(mode==="ordinal")?r+1:null}; });
    }
  }
  return arr;
}

/* ---- SVG ---- */
function carSVG(color,number,fontSize){ const c=COLORS[color];
  let numTxt="";
  if(number!=null){
    const s=String(number), fs = fontSize || (s.length<=1?46 : s.length===2?40 : s.length===3?32 : 26);
    numTxt = `<text x="101" y="84" text-anchor="middle" dominant-baseline="central"
      font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800" font-size="${fs}"
      fill="#ffffff" stroke="${c.dark}" stroke-width="6" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
  }
  return `
  <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 104 C14 104 12 100 14 96 L24 78 C28 70 36 60 50 58 C70 55 92 48 118 50 C140 52 156 64 166 80 L178 92 C184 96 186 100 184 104 Z"
      fill="${c.fill}" stroke="${c.dark}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 58 C66 44 78 40 92 40 L120 40 C134 42 148 52 158 70" fill="none" stroke="${c.dark}" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 58 C74 48 82 47 92 47 L100 47 L100 58 Z" fill="#bfe0ff" stroke="${c.dark}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M108 47 L120 47 C132 48 140 54 146 60 L108 60 Z" fill="#bfe0ff" stroke="${c.dark}" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="176" cy="92" rx="6" ry="5" fill="#ffe9a8" stroke="${c.dark}" stroke-width="2"/>
    <circle cx="62" cy="106" r="20" fill="#2b2d42"/><circle cx="62" cy="106" r="9" fill="#c9ccd6"/>
    <circle cx="142" cy="106" r="20" fill="#2b2d42"/><circle cx="142" cy="106" r="9" fill="#c9ccd6"/>
    ${numTxt}
  </svg>`; }
function garageSVG(color){ const c=COLORS[color]; return `
  <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 60 L100 20 L184 60 Z" fill="${c.fill}" stroke="${c.dark}" stroke-width="4" stroke-linejoin="round"/>
    <rect x="22" y="58" width="156" height="92" fill="#fff" stroke="${c.dark}" stroke-width="4"/>
    <rect x="40" y="72" width="120" height="78" fill="${c.fill}" stroke="${c.dark}" stroke-width="4"/>
    <g stroke="${c.dark}" stroke-width="2" opacity=".5"><line x1="40" y1="90" x2="160" y2="90"/><line x1="40" y1="108" x2="160" y2="108"/><line x1="40" y1="126" x2="160" y2="126"/></g>
    <circle cx="100" cy="48" r="17" fill="#fff" stroke="${c.dark}" stroke-width="3"/>
    <path d="M86 50 c2-6 6-9 14-9 s12 3 14 9" fill="none" stroke="#2b2d42" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="52" r="3.5" fill="#2b2d42"/><circle cx="108" cy="52" r="3.5" fill="#2b2d42"/>
  </svg>`; }

/* ---- Sound ---- */
let soundOn=true, ac=null;
function beep(f,d,t="sine",v=.15,slide=null){ if(!soundOn) return; try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(); o.type=t; o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);
  g.gain.value=v; g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d);
}catch(e){} }
const sSlide=()=>beep(420,.07,"triangle",.12,520);
const sNo   =()=>beep(150,.12,"sawtooth",.1);
const sWin  =()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.2),i*130));

/* ---- DOM ---- */
const garagesEl=document.getElementById("garages");
const cellsEl=document.getElementById("cells");
const tilesEl=document.getElementById("tiles");
const movesEl=document.getElementById("moves");
const boardEl=document.getElementById("board");
const hintEl=document.getElementById("hint");
const winEl=document.getElementById("win");
let garageEls={};
let grid=[], empty=0, moves=0, locked=false;

function buildStatic(){
  garageEls={};
  garagesEl.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  garagesEl.innerHTML="";
  colors().forEach(color=>{
    const g=document.createElement("div"); g.className="garage";
    g.innerHTML=garageSVG(color)+`<div class="check">✅</div>`;
    garagesEl.appendChild(g); garageEls[color]=g;
  });
  boardEl.style.aspectRatio=COLS+" / "+ROWS;
  cellsEl.style.gridTemplate=`repeat(${ROWS},1fr) / repeat(${COLS},1fr)`;
  cellsEl.innerHTML="";
  for(let i=0;i<COLS*ROWS;i++){
    const c=document.createElement("div"); c.className="cell";
    const col=i%COLS, row=Math.floor(i/COLS);
    c.style.borderRight=(col<COLS-1)?"3px solid var(--line)":"none";
    c.style.borderBottom=(row<ROWS-1)?"3px solid var(--line)":"none";
    cellsEl.appendChild(c);
  }
  hintEl.textContent =
    mode==="sort"    ? "Mathe: jede Spalte aufsteigend sortieren – kleinste Zahl oben." :
    mode==="ordinal" ? "Profi: jede Spalte eine Farbe, von oben nach unten 1, 2, 3 …" :
                       "Schiebe jede Farbe in ihre Spalte unter der passenden Garage.";
}

function startBoard(){
  winEl.classList.remove("show");
  const total=COLS*ROWS; tilesEl.innerHTML=""; grid=new Array(total).fill(null);
  moves=0; movesEl.textContent="Züge: 0"; locked=false;
  const solved=buildSolved();
  let uniFs=null;
  if(mode!=="color"){
    let maxLen=1; solved.forEach(c=>{ if(c) maxLen=Math.max(maxLen,String(c.number).length); });
    uniFs = maxLen<=1?46 : maxLen===2?40 : maxLen===3?32 : 26;
  }
  for(let i=0;i<total;i++){
    const cell=solved[i];
    if(cell===null){ empty=i; continue; }
    const t={color:cell.color, number:cell.number, goal:i, index:i, el:document.createElement("div")};
    t.el.className="tile";
    t.el.style.width=(100/COLS)+"%"; t.el.style.height=(100/ROWS)+"%";
    t.el.innerHTML=carSVG(cell.color, (mode==="color")?null:cell.number, uniFs);
    t.el.addEventListener("click",()=>tryMove(t.index));
    tilesEl.appendChild(t.el); grid[i]=t; place(t);
  }
  empty=total-1;
  shuffle();
  updateMovable(); updateChecks();
}

function place(t){ const r=Math.floor(t.index/COLS), c=t.index%COLS;
  t.el.style.left=(c*100/COLS)+"%"; t.el.style.top=(r*100/ROWS)+"%"; }

function neighbors(i){ const r=Math.floor(i/COLS),c=i%COLS,n=[];
  if(r>0)n.push(i-COLS); if(r<ROWS-1)n.push(i+COLS); if(c>0)n.push(i-1); if(c<COLS-1)n.push(i+1); return n; }

function swapInto(ti){ const t=grid[ti]; grid[empty]=t; grid[ti]=null; t.index=empty; empty=ti; place(t); }

function shuffle(){ let prev=-1,count=0,max=(COLS*ROWS)*30;
  while(count<max){ const opts=neighbors(empty).filter(i=>i!==prev);
    const pick=opts[Math.floor(Math.random()*opts.length)]; prev=empty; swapInto(pick); count++; }
  if(isSolved()) shuffle();
}

function tryMove(ti){
  if(locked) return;
  if(!neighbors(empty).includes(ti)){ const t=grid[ti]; if(t){ t.el.classList.add("bump"); setTimeout(()=>t.el.classList.remove("bump"),300);} sNo(); return; }
  swapInto(ti); sSlide();
  moves++; movesEl.textContent="Züge: "+moves;
  updateMovable(); updateChecks();
  if(isSolved()) win();
}

function updateMovable(){ for(let i=0;i<grid.length;i++){ if(grid[i]) grid[i].el.classList.toggle("movable",neighbors(empty).includes(i)); } }

function isSolved(){ for(let i=0;i<grid.length;i++){ const t=grid[i]; if(t && !matches(t,i)) return false; } return true; }
function colDone(col){
  const total=COLS*ROWS, lastCol=COLS-1;
  for(let r=0;r<ROWS;r++){
    const i=r*COLS+col, t=grid[i];
    if(t){ if(!matches(t,i)) return false; }
    else if(mode==="color"){ if(col!==lastCol) return false; }   // freie Lücke nur in der letzten Spalte ok
    else { if(i!==total-1) return false; }                       // exakter Modus: Lücke nur unten rechts
  }
  return true;
}
function updateChecks(){ colors().forEach((color,col)=> garageEls[color].classList.toggle("done",colDone(col)) ); }

function win(){ locked=true; document.getElementById("wintext").textContent="Geschafft in "+moves+" Zügen!";
  winEl.classList.add("show"); sWin(); confettiBurst(); }

/* Tastatur */
document.addEventListener("keydown",e=>{
  const m={ArrowUp:empty+COLS,ArrowDown:empty-COLS,ArrowLeft:empty+1,ArrowRight:empty-1};
  if(m[e.key]!==undefined && m[e.key]>=0 && m[e.key]<COLS*ROWS && neighbors(empty).includes(m[e.key])){ e.preventDefault(); tryMove(m[e.key]); }
});

/* Confetti */
const cv=document.getElementById("confetti"), cx=cv.getContext("2d");
let pieces=[],raf=null;
function sizeCv(){ cv.width=innerWidth; cv.height=innerHeight; }
sizeCv(); addEventListener("resize",sizeCv);
function confettiBurst(){ const cols=["#2f6fd0","#f2ac1d","#2f9e44","#e23b3b","#ffd23f","#7c4dff"]; pieces=[];
  for(let i=0;i<150;i++) pieces.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:5+Math.random()*7,c:cols[i%cols.length],vy:2+Math.random()*3,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  if(!raf) anim(); setTimeout(()=>pieces=[],4200);
}
function anim(){ cx.clearRect(0,0,cv.width,cv.height);
  pieces.forEach(p=>{ p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=.03; cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);cx.restore(); });
  if(pieces.length) raf=requestAnimationFrame(anim); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
}

/* Clouds */
(function(){ const w=document.getElementById("clouds");
  for(let i=0;i<5;i++){ const c=document.createElement("div"); c.className="cloud";
    const ww=80+Math.random()*120; c.style.width=ww+"px"; c.style.height=(ww*.42)+"px";
    c.style.top=(5+Math.random()*40)+"%"; c.style.animationDuration=(28+Math.random()*30)+"s";
    c.style.animationDelay=(-Math.random()*30)+"s"; w.appendChild(c); } })();

/* Responsive */
function layout(){
  const header=document.querySelector("header"), toolbar=document.querySelector(".toolbar"), hint=document.querySelector(".hint");
  const used=header.offsetHeight+toolbar.offsetHeight+hint.offsetHeight+34;
  const availH=innerHeight-used;
  const availW=Math.min(innerWidth-20,520);
  let bw=Math.min(availW,(availH-8)*COLS/(ROWS+0.8));
  bw=Math.max(150,bw);
  document.getElementById("stage").style.width=bw+"px";
}
addEventListener("resize",layout);

/* Controls */
document.getElementById("shuffle").addEventListener("click",startBoard);
document.getElementById("again").addEventListener("click",startBoard);
document.getElementById("sound").addEventListener("click",e=>{ soundOn=!soundOn; e.currentTarget.textContent=soundOn?"🔊":"🔇"; });
document.getElementById("diff").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#diff button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  COLS=+b.dataset.cols; ROWS=+b.dataset.rows; mode=b.dataset.mode||"color";
  buildStatic(); layout(); startBoard();
});

/* Start */
buildStatic(); layout(); startBoard();
</script>
</body>
</html>
